[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-com"
version = "0.2.0"
description = "Catalog-driven retro game library manager"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "flask>=3.0",
]

[tool.setuptools.package-data]
romcom = ["webui/*"]

[project.scripts]
romcom = "romcom.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
